name: Build, test, and deploy portfolio

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Retained 40-character release SHA to activate on the selected branch environment"
        required: false
        type: string
      promote_candidate_sha:
        description: "Privately verified 40-character beta release SHA to promote to production"
        required: false
        type: string
      promote_artifact_sha256:
        description: "SHA-256 of the exact privately verified beta artifact"
        required: false
        type: string
      retire_legacy_beta:
        description: "One-time exact confirmation: RETIRE-BETA"
        required: false
        type: string

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retire-legacy-beta:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.retire_legacy_beta == 'RETIRE-BETA'
    runs-on: homelab
    environment: beta
    permissions:
      contents: read
    steps:
      - name: Check out retirement tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install Worker tooling
        working-directory: chat-worker
        run: npm ci
      - name: Verify exact retirement targets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          bash infrastructure/kantercloud/cloudflare-beta.sh retire-plan
          npx --prefix chat-worker wrangler delete portfolio-chat-beta --dry-run
      - name: Delete only the beta Worker, DNS, Access app, and Tunnel
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --prefix chat-worker wrangler delete portfolio-chat-beta --force
          bash infrastructure/kantercloud/cloudflare-beta.sh retire
      - name: Prove beta publication is absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bash infrastructure/kantercloud/cloudflare-beta.sh audit-retired

  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: homelab
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    runs-on: homelab
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=low

  chat-worker-validate:
    runs-on: homelab
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=low
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Audit knowledge freshness
        run: npm run knowledge:audit
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  build-and-test:
    runs-on: homelab-heavy
    env:
      # Keep browser installation private to this job. The homelab runner's
      # shared cache can be pruned while parallel Playwright shards are active.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      # The chatbot ships in every build; the Worker route for the matching
      # hostname serves its API.
      PUBLIC_CHAT_ENABLED: 'true'
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive build output
        run: |
          tar -czf ../site-dist.tar.gz -C dist .
          sha256sum ../site-dist.tar.gz | awk '{print $1}' > ../site-dist.tar.gz.sha256
          sha256sum dist/index.html | awk '{print $1}' > ../site-index.html.sha256
      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: site-dist
          path: |
            site-dist.tar.gz
            site-dist.tar.gz.sha256
            site-index.html.sha256
          if-no-files-found: error

  deploy:
    # Both kill switches are repository-scoped so GitHub can evaluate them
    # before the branch-specific environment is attached to the runner.
    if: >-
      github.event_name != 'pull_request' &&
      (
        (github.ref_name == 'beta' && vars.BETA_DEPLOY_ENABLED == 'true') ||
        (
          github.ref_name == 'main' &&
          github.event_name == 'workflow_dispatch' &&
          vars.DEPLOY_ENABLED == 'true' &&
          (
            inputs.rollback_sha != '' ||
            (inputs.promote_candidate_sha != '' && inputs.promote_artifact_sha256 != '')
          )
        )
      )
    needs: [dependency-audit, chat-worker-validate, build-and-test]
    runs-on: homelab
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
      url: ${{ github.ref_name == 'beta' && 'https://kanter-edge.tail848b9c.ts.net:9445' || 'https://shanekanterman.dev' }}
    permissions:
      contents: read
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download build artifact
        if: github.ref_name == 'beta' && inputs.rollback_sha == ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: site-dist
      - name: Configure deployment SSH identity
        env:
          PORTFOLIO_DEPLOY_SSH_KEY: ${{ secrets.PORTFOLIO_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$PORTFOLIO_DEPLOY_SSH_KEY" > ~/.ssh/portfolio
          chmod 0600 ~/.ssh/portfolio
          install -m 0644 infrastructure/kantercloud/portfolio-known-hosts \
            ~/.ssh/known_hosts
      - name: Verify private management deployment path
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ipaddress
          target = ipaddress.ip_address("10.40.0.32")
          if not target.is_private:
              raise SystemExit("deployment target is not a private management address")
          PY
          ip route get 10.40.0.32 | grep -qv '^unreachable'
          timeout 5 bash -c '</dev/tcp/10.40.0.32/22'
      - name: Deploy immutable candidate release
        if: github.ref_name == 'beta' && inputs.rollback_sha == ''
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_SHA256=$(tr -d '\n' < site-dist.tar.gz.sha256)
          printf '%s' "$ARTIFACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          printf '%s  %s\n' "$ARTIFACT_SHA256" site-dist.tar.gz | sha256sum --check --strict
          ssh -i ~/.ssh/portfolio "portfolio-beta-deploy@10.40.0.32" \
            "deploy $RELEASE_SHA $ARTIFACT_SHA256" < site-dist.tar.gz
      - name: Promote exact verified candidate
        if: github.ref_name == 'main' && inputs.rollback_sha == ''
        env:
          CANDIDATE_SHA: ${{ inputs.promote_candidate_sha }}
          ARTIFACT_SHA256: ${{ inputs.promote_artifact_sha256 }}
          PRODUCTION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s' "$CANDIDATE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$ARTIFACT_SHA256" | grep -Eq '^[0-9a-f]{64}$'
          ssh -i ~/.ssh/portfolio "portfolio-deploy@10.40.0.32" \
            "promote $CANDIDATE_SHA $ARTIFACT_SHA256 $PRODUCTION_SHA"
      - name: Roll back to retained release
        if: inputs.rollback_sha != ''
        env:
          DEPLOY_USER: ${{ github.ref_name == 'beta' && 'portfolio-beta-deploy' || 'portfolio-deploy' }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          printf '%s' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "rollback_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          }
          ssh -i ~/.ssh/portfolio "$DEPLOY_USER@10.40.0.32" "rollback $ROLLBACK_SHA"
      - name: Verify production health
        if: github.ref_name == 'main'
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://shanekanterman.dev/healthz)
          [ "$response" = "ok" ]
          chat_health=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://shanekanterman.dev/api/chat/health)
          printf '%s' "$chat_health" | grep -q '"service":"portfolio-chat"'
      - name: Verify private candidate
        if: github.ref_name == 'beta'
        run: |
          set -euo pipefail
          endpoint=https://kanter-edge.tail848b9c.ts.net:9445
          resolve=kanter-edge.tail848b9c.ts.net:9445:100.112.144.103
          response=$(curl --fail --silent --show-error \
            --resolve "$resolve" \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$endpoint/healthz")
          [ "$response" = "ok" ]
          expected=$(tr -d '\n' < site-index.html.sha256)
          actual=$(curl --fail --silent --show-error \
            --resolve "$resolve" \
            --retry 5 --retry-delay 2 --retry-all-errors \
            "$endpoint/" | sha256sum | awk '{print $1}')
          [ "$actual" = "$expected" ]
      - name: Remove deployment SSH identity
        if: always()
        run: rm -f ~/.ssh/portfolio
