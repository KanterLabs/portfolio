name: Validate and publish portfolio

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:

concurrency:
  # Keep migrated runs separate from attempts queued on retired runner labels.
  group: portfolio-auto-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: homelab
    timeout-minutes: 5
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    runs-on: homelab
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workspace: [site, chat-worker]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Audit locked dependencies
        run: python3 ../scripts/npm_audit.py

  chat-worker-validate:
    runs-on: homelab
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Audit knowledge freshness
        run: npm run knowledge:audit
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  deployment-helper-test:
    runs-on: homelab
    timeout-minutes: 5
    steps:
      - name: Record executed workflow source
        run: |
          printf 'workflow-source=%s\n' "$GITHUB_WORKFLOW_SHA"
          printf 'Executed workflow source: `%s`\n' "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test transactional Coolify deployment helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  browser-test:
    runs-on: homelab
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PUBLIC_CHAT_ENABLED: "true"
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    needs: [dependency-audit, chat-worker-validate, deployment-helper-test, browser-test]
    runs-on: homelab
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_owner}/portfolio"
          docker build \
            --pull \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%d)" \
            --tag "$image:sha-$GITHUB_SHA" \
            .
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Smoke-test image
        run: |
          set -euo pipefail
          container_id=''
          html_file=$(mktemp)
          # shellcheck disable=SC2317
          cleanup() {
            local status=$?
            if [ -n "$container_id" ]; then
              if [ "$status" -ne 0 ]; then
                docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{json .State.Error}} ports={{json .NetworkSettings.Ports}}' "$container_id" || true
                docker logs --tail 40 "$container_id" || true
              fi
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            rm -f "$html_file"
          }
          trap cleanup EXIT
          container_id=$(docker run --detach \
            -e PORTFOLIO_X_ROBOTS_TAG='noindex, nofollow, noarchive' \
            -p 127.0.0.1::8080 \
            "$IMAGE:sha-$GITHUB_SHA")
          startup_deadline=$((SECONDS + 10))
          smoke_get() {
            local remaining=$((startup_deadline - SECONDS))
            [ "$remaining" -gt 0 ] && curl --fail --silent --max-time "$remaining" "$@"
          }
          while [ "$SECONDS" -lt "$startup_deadline" ]; do
            port_binding=$(timeout 1 docker port "$container_id" 8080/tcp 2>/dev/null || true)
            # The footer build stamp is injected at image-build time, so a
            # broken injection can only be caught against the built image --
            # never against a dev build, which can still fall back to git.
            if [[ "$port_binding" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]; then
              container_port=${BASH_REMATCH[1]}
              if ((10#$container_port > 0 && 10#$container_port <= 65535)) &&
                 smoke_get "http://127.0.0.1:${container_port}/healthz" | grep -qx ok &&
                 smoke_get "http://127.0.0.1:${container_port}/_meta/revision" | grep -qx "$GITHUB_SHA" &&
                 smoke_get "http://127.0.0.1:${container_port}/" --output "$html_file" &&
                 grep -q "site-footer-build\">Build .*${GITHUB_SHA:0:7}" "$html_file"; then
                exit 0
              fi
            fi
            sleep 1
          done
          exit 1
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable and branch tags
        id: publish
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          immutable="$IMAGE:sha-$GITHUB_SHA"
          branch="$IMAGE:${GITHUB_REF_NAME//\//-}"
          docker tag "$immutable" "$branch"
          docker push "$immutable"
          docker push "$branch"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$branch" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove GHCR credentials
        if: always() && github.event_name != 'pull_request'
        run: docker logout ghcr.io

  deploy-beta:
    if: github.event_name == 'push' && github.ref_name == 'beta'
    needs: container
    runs-on: homelab
    timeout-minutes: 15
    environment:
      name: beta
      url: https://beta.home.shanekanterman.dev
    permissions:
      contents: read
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      COOLIFY_APPLICATION_NAME: ${{ vars.COOLIFY_APPLICATION_NAME }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      PORTFOLIO_IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
      PORTFOLIO_GIT_SHA: ${{ github.sha }}
      PORTFOLIO_SITE_URL: https://beta.home.shanekanterman.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm this commit is still the branch tip
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          printf '%s\n' "$current" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            printf 'Skipping stale %s commit %s; current tip is %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy exact digest through Coolify
        if: steps.freshness.outputs.deploy == 'true'
        run: python3 scripts/coolify_deploy.py

  deploy-production:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: container
    runs-on: homelab
    timeout-minutes: 15
    environment:
      name: production
      url: https://shanekanterman.dev
    permissions:
      contents: read
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      COOLIFY_APPLICATION_NAME: ${{ vars.COOLIFY_APPLICATION_NAME }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      PORTFOLIO_IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
      PORTFOLIO_GIT_SHA: ${{ github.sha }}
      PORTFOLIO_SITE_URL: https://shanekanterman.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm this commit is still the branch tip
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          printf '%s\n' "$current" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            printf 'Skipping stale %s commit %s; current tip is %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy exact digest through Coolify
        if: steps.freshness.outputs.deploy == 'true'
        run: python3 scripts/coolify_deploy.py
