name: Validate and publish portfolio

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: homelab
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    runs-on: homelab
    strategy:
      fail-fast: false
      matrix:
        workspace: [site, chat-worker]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Audit locked dependencies
        run: npm audit --package-lock-only --audit-level=low

  chat-worker-validate:
    runs-on: homelab
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Audit knowledge freshness
        run: npm run knowledge:audit
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  browser-test:
    runs-on: homelab-heavy
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PUBLIC_CHAT_ENABLED: "true"
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    needs: [dependency-audit, chat-worker-validate, browser-test]
    runs-on: homelab-heavy
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_owner}/portfolio"
          docker build \
            --pull \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --tag "$image:sha-$GITHUB_SHA" \
            .
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Smoke-test image
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --rm \
            -e PORTFOLIO_X_ROBOTS_TAG='noindex, nofollow, noarchive' \
            -p 127.0.0.1::8080 \
            "$IMAGE:sha-$GITHUB_SHA")
          # shellcheck disable=SC2317
          cleanup() { docker stop "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          container_port=$(docker port "$container_id" 8080/tcp | sed 's/.*://')
          for delay in 0 1 1 1 1; do
            sleep "$delay"
            if curl --fail --silent "http://127.0.0.1:${container_port}/healthz" | grep -qx ok; then
              exit 0
            fi
          done
          docker logs "$container_id"
          exit 1
      - name: Authenticate to GHCR
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable and branch tags
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          immutable="$IMAGE:sha-$GITHUB_SHA"
          branch="$IMAGE:${GITHUB_REF_NAME//\//-}"
          docker tag "$immutable" "$branch"
          docker push "$immutable"
          docker push "$branch"
          digest=$(docker image inspect "$immutable" --format "{{index .RepoDigests 0}}" | cut -d@ -f2)
          printf 'Published %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove GHCR credentials
        if: always() && github.event_name != 'pull_request'
        run: docker logout ghcr.io
