name: Validate and publish portfolio

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      container: ${{ steps.paths.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify browser and container inputs
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import fnmatch, os, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not base or set(base) == {'0'}:
              paths = ['site/', 'Dockerfile']
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base + ('...' if os.environ['EVENT_NAME'] == 'pull_request' else '..') + head], text=True).splitlines()
          browser = any(fnmatch.fnmatch(p, pattern) for p in paths for pattern in
                        ['site/*', 'chat-worker/*', 'chat-content/*', 'divstack/*', '.gitmodules', 'scripts/*', '.github/workflows/*', 'package*'])
          container = os.environ['EVENT_NAME'] != 'pull_request' or browser or any(
              fnmatch.fnmatch(p, pattern) for p in paths for pattern in ['Dockerfile', '.dockerignore', 'container/*'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'browser={str(browser).lower()}\ncontainer={str(container).lower()}\n')
          PYCODE

  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        workspace: [site, chat-worker]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Audit locked dependencies
        run: python3 ../scripts/npm_audit.py

  chat-worker-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Audit knowledge freshness
        run: npm run knowledge:audit
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  deployment-helper-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test transactional Coolify deployment helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  browser-test:
    if: always()
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PUBLIC_CHAT_ENABLED: "true"
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        if: needs.changes.outputs.browser == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        if: needs.changes.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        if: needs.changes.outputs.browser == 'true'
        run: npm ci
      - name: Cache matching Playwright Chromium downloads
        if: needs.changes.outputs.browser == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('site/package-lock.json') }}
      - name: Install browser
        if: needs.changes.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        if: needs.changes.outputs.browser == 'true'
        run: npm run test:e2e
      - name: Upload Playwright report
        if: needs.changes.outputs.browser == 'true' && (failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report required browser validation result
        working-directory: ${{ github.workspace }}
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$BROWSER_REQUIRED" = true || test "$BROWSER_REQUIRED" = false
          test "$VALIDATION_STATUS" = success

  container:
    needs: [changes, dependency-audit, chat-worker-validate, deployment-helper-test, browser-test]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: portfolio-container-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        if: needs.changes.outputs.container == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable image
        if: needs.changes.outputs.container == 'true'
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_owner}/portfolio"
          docker build \
            --pull \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%d)" \
            --tag "$image:sha-$GITHUB_SHA" \
            .
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Smoke-test image
        if: needs.changes.outputs.container == 'true'
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --rm \
            -e PORTFOLIO_X_ROBOTS_TAG='noindex, nofollow, noarchive' \
            -p 127.0.0.1::8080 \
            "$IMAGE:sha-$GITHUB_SHA")
          # shellcheck disable=SC2317
          cleanup() { docker stop "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          container_port=$(docker port "$container_id" 8080/tcp | sed 's/.*://')
          for delay in 0 1 1 1 1; do
            sleep "$delay"
            # The footer build stamp is injected at image-build time, so a
            # broken injection can only be caught against the built image --
            # never against a dev build, which can still fall back to git.
            if curl --fail --silent "http://127.0.0.1:${container_port}/healthz" | grep -qx ok &&
               curl --fail --silent "http://127.0.0.1:${container_port}/_meta/revision" | grep -qx "$GITHUB_SHA" &&
               curl --fail --silent "http://127.0.0.1:${container_port}/" |
                 grep -q "site-footer-build\">Build .*${GITHUB_SHA:0:7}"; then
              exit 0
            fi
          done
          docker logs "$container_id"
          exit 1
      - name: Authenticate to GHCR
        if: needs.changes.outputs.container == 'true' && (github.event_name != 'pull_request')
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable and branch tags
        id: publish
        if: needs.changes.outputs.container == 'true' && (github.event_name != 'pull_request')
        run: |
          set -euo pipefail
          immutable="$IMAGE:sha-$GITHUB_SHA"
          branch="$IMAGE:${GITHUB_REF_NAME//\//-}"
          docker tag "$immutable" "$branch"
          docker push "$immutable"
          docker push "$branch"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$branch" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove GHCR credentials
        if: always() && needs.changes.outputs.container == 'true' && github.event_name != 'pull_request'
        run: docker logout ghcr.io

  deploy-beta:
    if: github.event_name == 'push' && github.ref_name == 'beta'
    needs: container
    runs-on: ubuntu-24.04
    concurrency:
      group: portfolio-deploy-beta-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: beta
      url: https://beta.home.shanekanterman.dev
    permissions:
      contents: read
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      COOLIFY_APPLICATION_NAME: ${{ vars.COOLIFY_APPLICATION_NAME }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      PORTFOLIO_IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
      PORTFOLIO_GIT_SHA: ${{ github.sha }}
      PORTFOLIO_SITE_URL: https://beta.home.shanekanterman.dev
    steps:
      - name: Connect protected deployment to the private tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-portfolio-deploy
          args: --accept-routes
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm this commit is still the branch tip
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          printf '%s\n' "$current" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            printf 'Skipping stale %s commit %s; current tip is %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy exact digest through Coolify
        if: steps.freshness.outputs.deploy == 'true'
        run: python3 scripts/coolify_deploy.py

  deploy-production:
    if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[ci-hosted-cutover]') && github.ref_name == 'main'
    needs: container
    runs-on: ubuntu-24.04
    concurrency:
      group: portfolio-deploy-production-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 15
    environment:
      name: production
      url: https://shanekanterman.dev
    permissions:
      contents: read
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APPLICATION_UUID: ${{ vars.COOLIFY_APPLICATION_UUID }}
      COOLIFY_APPLICATION_NAME: ${{ vars.COOLIFY_APPLICATION_NAME }}
      COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID }}
      COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID }}
      PORTFOLIO_IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
      PORTFOLIO_GIT_SHA: ${{ github.sha }}
      PORTFOLIO_SITE_URL: https://shanekanterman.dev
    steps:
      - name: Connect protected deployment to the private tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-portfolio-deploy
          args: --accept-routes
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Confirm this commit is still the branch tip
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          current=$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          printf '%s\n' "$current" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            printf 'Skipping stale %s commit %s; current tip is %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy exact digest through Coolify
        if: steps.freshness.outputs.deploy == 'true'
        run: python3 scripts/coolify_deploy.py
