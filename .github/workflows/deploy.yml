name: Build, test, and deploy portfolio

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Retained 40-character release SHA to activate on the selected branch environment"
        required: false
        type: string

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: homelab
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    runs-on: homelab
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=low

  chat-worker-validate:
    runs-on: homelab
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --package-lock-only --audit-level=low
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  build-and-test:
    runs-on: homelab-heavy
    env:
      # Keep browser installation private to this job. The homelab runner's
      # shared cache can be pruned while parallel Playwright shards are active.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      # The chatbot ships in every build; the Worker route for the matching
      # hostname serves its API.
      PUBLIC_CHAT_ENABLED: 'true'
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install browser
        run: npx playwright install chromium
      - name: Run browser tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive build output
        run: tar -czf ../site-dist.tar.gz -C dist .
      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: site-dist
          path: site-dist.tar.gz
          if-no-files-found: error

  deploy:
    # Both kill switches are repository-scoped so GitHub can evaluate them
    # before the branch-specific environment is attached to the runner.
    if: >-
      github.event_name != 'pull_request' &&
      (
        (github.ref_name == 'main' && vars.DEPLOY_ENABLED == 'true') ||
        (github.ref_name == 'beta' && vars.BETA_DEPLOY_ENABLED == 'true')
      )
    needs: [dependency-audit, chat-worker-validate, build-and-test]
    runs-on: homelab
    timeout-minutes: 10
    environment:
      name: ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
      url: ${{ github.ref_name == 'beta' && 'https://beta.shanekanterman.dev' || 'https://shanekanterman.dev' }}
    permissions:
      contents: read
    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Node.js for Worker deployment
        if: inputs.rollback_sha == ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install Worker dependencies
        if: inputs.rollback_sha == ''
        working-directory: chat-worker
        run: npm ci
      - name: Deploy chat Worker
        if: inputs.rollback_sha == ''
        working-directory: chat-worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_ENV: ${{ github.ref_name == 'beta' && 'beta' || 'production' }}
        run: npm run "deploy:$WORKER_ENV"
      - name: Download build artifact
        if: inputs.rollback_sha == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: site-dist
      - name: Configure deployment SSH identity
        env:
          PORTFOLIO_DEPLOY_SSH_KEY: ${{ secrets.PORTFOLIO_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 0700 -d ~/.ssh
          printf '%s\n' "$PORTFOLIO_DEPLOY_SSH_KEY" > ~/.ssh/portfolio
          chmod 0600 ~/.ssh/portfolio
          install -m 0644 infrastructure/kantercloud/portfolio-known-hosts \
            ~/.ssh/known_hosts
      - name: Deploy release
        if: inputs.rollback_sha == ''
        env:
          DEPLOY_USER: ${{ github.ref_name == 'beta' && 'portfolio-beta-deploy' || 'portfolio-deploy' }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/portfolio "$DEPLOY_USER@10.40.0.32" "deploy $RELEASE_SHA" < site-dist.tar.gz
      - name: Roll back to retained release
        if: inputs.rollback_sha != ''
        env:
          DEPLOY_USER: ${{ github.ref_name == 'beta' && 'portfolio-beta-deploy' || 'portfolio-deploy' }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          printf '%s' "$ROLLBACK_SHA" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "rollback_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          }
          ssh -i ~/.ssh/portfolio "$DEPLOY_USER@10.40.0.32" "rollback $ROLLBACK_SHA"
      - name: Verify production health
        if: github.ref_name == 'main'
        run: |
          response=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://shanekanterman.dev/healthz)
          [ "$response" = "ok" ]
          chat_health=$(curl --fail --silent --show-error \
            --retry 5 --retry-delay 2 --retry-all-errors \
            https://shanekanterman.dev/api/chat/health)
          printf '%s' "$chat_health" | grep -q '"service":"portfolio-chat"'
      - name: Verify beta Access gate
        if: github.ref_name == 'beta'
        run: |
          for url in \
            https://beta.shanekanterman.dev/healthz \
            https://beta.shanekanterman.dev/api/chat/health
          do
            status=$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              --retry 5 --retry-delay 2 --retry-all-errors \
              "$url")
            [ "$status" = "302" ] || [ "$status" = "303" ]
          done
      - name: Remove deployment SSH identity
        if: always()
        run: rm -f ~/.ssh/portfolio
