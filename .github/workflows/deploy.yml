name: Validate and publish portfolio

on:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab' }}
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      container: ${{ steps.paths.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify browser and container inputs
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYCODE'
          import fnmatch, os, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not base or set(base) == {'0'}:
              paths = ['site/', 'Dockerfile']
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base + ('...' if os.environ['EVENT_NAME'] == 'pull_request' else '..') + head], text=True).splitlines()
          browser = any(fnmatch.fnmatch(p, pattern) for p in paths for pattern in
                        ['site/*', 'chat-worker/*', 'chat-content/*', 'divstack/*', '.gitmodules', 'scripts/*', '.github/workflows/*', 'package*'])
          container = os.environ['EVENT_NAME'] != 'pull_request' or browser or any(
              fnmatch.fnmatch(p, pattern) for p in paths for pattern in ['Dockerfile', '.dockerignore', 'container/*'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'browser={str(browser).lower()}\ncontainer={str(container).lower()}\n')
          PYCODE

  promotion-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab' }}
    timeout-minutes: 5
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab' }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workspace: [site, chat-worker]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Audit locked dependencies
        run: python3 ../scripts/npm_audit.py

  chat-worker-validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Audit knowledge freshness
        run: npm run knowledge:audit
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  deployment-helper-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab' }}
    timeout-minutes: 5
    steps:
      - name: Record executed workflow source
        run: |
          printf 'workflow-source=%s\n' "$GITHUB_WORKFLOW_SHA"
          printf 'Executed workflow source: `%s`\n' "$GITHUB_WORKFLOW_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test transactional Coolify deployment helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  browser-test:
    if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs: changes
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab-heavy' }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      PUBLIC_CHAT_ENABLED: "true"
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        if: needs.changes.outputs.browser == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node.js
        if: needs.changes.outputs.browser == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        if: needs.changes.outputs.browser == 'true'
        run: npm ci
      - name: Cache matching Playwright Chromium downloads
        if: needs.changes.outputs.browser == 'true'
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('site/package-lock.json') }}
      - name: Install browser
        if: needs.changes.outputs.browser == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        if: needs.changes.outputs.browser == 'true'
        run: npm run test:e2e
      - name: Upload Playwright report
        if: needs.changes.outputs.browser == 'true' && (failure())
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report required browser validation result
        working-directory: ${{ github.workspace }}
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$BROWSER_REQUIRED" = true || test "$BROWSER_REQUIRED" = false
          test "$VALIDATION_STATUS" = success

  container:
    needs: [changes, dependency-audit, chat-worker-validate, deployment-helper-test, browser-test]
    runs-on: ${{ (github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'source-sync/'))) && 'ubuntu-24.04' || 'homelab-heavy' }}
    concurrency:
      group: portfolio-container-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 20
    outputs:
      image_digest: ${{ steps.publish.outputs.image_digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        if: needs.changes.outputs.container == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build immutable image
        if: needs.changes.outputs.container == 'true'
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          image_owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_owner}/portfolio"
          docker build \
            --pull \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%d)" \
            --tag "$image:sha-$GITHUB_SHA" \
            .
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Smoke-test image
        if: needs.changes.outputs.container == 'true'
        run: |
          set -euo pipefail
          container_id=''
          html_file=$(mktemp)
          # shellcheck disable=SC2317
          cleanup() {
            local status=$?
            if [ -n "$container_id" ]; then
              if [ "$status" -ne 0 ]; then
                docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{json .State.Error}} ports={{json .NetworkSettings.Ports}}' "$container_id" || true
                docker logs --tail 40 "$container_id" || true
              fi
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            rm -f "$html_file"
          }
          trap cleanup EXIT
          container_id=$(docker run --detach \
            -e PORTFOLIO_X_ROBOTS_TAG='noindex, nofollow, noarchive' \
            -p 127.0.0.1::8080 \
            "$IMAGE:sha-$GITHUB_SHA")
          startup_deadline=$((SECONDS + 10))
          smoke_get() {
            local remaining=$((startup_deadline - SECONDS))
            [ "$remaining" -gt 0 ] && curl --fail --silent --max-time "$remaining" "$@"
          }
          while [ "$SECONDS" -lt "$startup_deadline" ]; do
            port_binding=$(timeout 1 docker port "$container_id" 8080/tcp 2>/dev/null || true)
            # The footer build stamp is injected at image-build time, so a
            # broken injection can only be caught against the built image --
            # never against a dev build, which can still fall back to git.
            if [[ "$port_binding" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]; then
              container_port=${BASH_REMATCH[1]}
              if ((10#$container_port > 0 && 10#$container_port <= 65535)) &&
                 smoke_get "http://127.0.0.1:${container_port}/healthz" | grep -qx ok &&
                 smoke_get "http://127.0.0.1:${container_port}/_meta/revision" | grep -qx "$GITHUB_SHA" &&
                 smoke_get "http://127.0.0.1:${container_port}/" --output "$html_file" &&
                 grep -q "site-footer-build\">Build .*${GITHUB_SHA:0:7}" "$html_file"; then
                exit 0
              fi
            fi
            sleep 1
          done
          exit 1
      - name: Authenticate to GHCR
        if: needs.changes.outputs.container == 'true' && (github.event_name != 'pull_request')
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish immutable and branch tags
        id: publish
        if: needs.changes.outputs.container == 'true' && (github.event_name != 'pull_request')
        run: |
          set -euo pipefail
          immutable="$IMAGE:sha-$GITHUB_SHA"
          branch="$IMAGE:${GITHUB_REF_NAME//\//-}"
          docker tag "$immutable" "$branch"
          docker push "$immutable"
          docker push "$branch"
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$immutable" |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])')
          printf '%s\n' "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published %s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove GHCR credentials
        if: always() && needs.changes.outputs.container == 'true' && github.event_name != 'pull_request'
        run: docker logout ghcr.io

  deploy-beta:
    if: github.event_name == 'push' && github.ref_name == 'beta'
    needs: container
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      environment: beta
      image_digest: ${{ needs.container.outputs.image_digest }}
    secrets: inherit

  deploy-production-pdx1:
    if: github.event_name == 'push' && github.ref_name == 'main'
    needs: container
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      environment: production
      image_digest: ${{ needs.container.outputs.image_digest }}
      stage_assets: true
    secrets: inherit

  deploy-production-iad1:
    if: needs.deploy-production-pdx1.outputs.deployed == 'true'
    needs: [container, deploy-production-pdx1]
    uses: ./.github/workflows/deploy-coolify.yml
    with:
      environment: production
      variable_prefix: IAD1_
      image_digest: ${{ needs.container.outputs.image_digest }}
      # Once rollout starts, finish the same digest on both origins even when
      # main advances. The caller serializes the complete branch workflow.
      check_branch_tip: false
    secrets: inherit

