name: Portfolio Cloudflare maintenance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-access:
    runs-on: homelab
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check existing protected Cloudflare load balancing access
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_ZONE: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          python3 - <<'PYCODE'
          import json, os, urllib.error, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  return None
          paths = {
              'token': '/user/tokens/verify',
              'monitors': '/accounts/' + os.environ['CF_ACCOUNT'] + '/load_balancers/monitors',
              'pools': '/accounts/' + os.environ['CF_ACCOUNT'] + '/load_balancers/pools',
              'load_balancers': '/zones/' + os.environ['CF_ZONE'] + '/load_balancers',
          }
          result = {}
          for name, path in paths.items():
              request = urllib.request.Request('https://api.cloudflare.com/client/v4' + path,
                  headers={'Authorization': 'Bearer ' + os.environ['CF_TOKEN'], 'Accept': 'application/json'})
              try:
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                      data = json.load(response)
                      result[name] = {'http': response.status, 'success': bool(data.get('success'))}
                      if isinstance(data.get('result'), list):
                          result[name]['count'] = len(data['result'])
              except urllib.error.HTTPError as error:
                  result[name] = {'http': error.code, 'success': False}
                  error.close()
          safe = json.dumps(result, sort_keys=True)
          print(safe)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Cloudflare permission preflight (no provider writes):\n\n```json\n' + safe + '\n```\n')
          PYCODE
