name: Deploy Portfolio digest through Coolify

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      variable_prefix:
        default: ''
        type: string
      image_digest:
        required: true
        type: string
      check_branch_tip:
        default: true
        type: boolean
      stage_assets:
        default: false
        type: boolean
    outputs:
      deployed:
        description: Whether this release passed target verification
        value: ${{ jobs.deploy.outputs.deployed }}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: homelab
    # Allow bounded asset staging, rollout and a complete rollback transaction.
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars[format('{0}PORTFOLIO_SITE_URL', inputs.variable_prefix)] }}
    outputs:
      deployed: ${{ steps.complete.outputs.deployed }}
    env:
      COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_APPLICATION_UUID: ${{ vars[format('{0}COOLIFY_APPLICATION_UUID', inputs.variable_prefix)] }}
      COOLIFY_APPLICATION_NAME: ${{ vars[format('{0}COOLIFY_APPLICATION_NAME', inputs.variable_prefix)] }}
      COOLIFY_DESTINATION_UUID: ${{ vars[format('{0}COOLIFY_DESTINATION_UUID', inputs.variable_prefix)] }}
      COOLIFY_SERVER_UUID: ${{ vars[format('{0}COOLIFY_SERVER_UUID', inputs.variable_prefix)] }}
      COOLIFY_ENVIRONMENT_UUID: ${{ vars[format('{0}COOLIFY_ENVIRONMENT_UUID', inputs.variable_prefix)] }}
      PORTFOLIO_IMAGE_DIGEST: ${{ inputs.image_digest }}
      PORTFOLIO_GIT_SHA: ${{ github.sha }}
      # Each production environment must point directly to its own origin.
      PORTFOLIO_SITE_URL: ${{ vars[format('{0}PORTFOLIO_SITE_URL', inputs.variable_prefix)] }}
    steps:
      - name: Connect protected deployment to the private tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:gha-portfolio-deploy
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Confirm this release is still the branch tip before rollout
        id: freshness
        env:
          REPOSITORY: ${{ github.repository }}
          CHECK_BRANCH_TIP: ${{ inputs.check_branch_tip }}
        run: |
          set -euo pipefail
          if [ "$CHECK_BRANCH_TIP" = false ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(git ls-remote "https://github.com/${REPOSITORY}.git" "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')
          printf '%s\n' "$current" | grep -Eq '^[0-9a-f]{40}$'
          if [ "$current" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            printf 'Skipping stale %s commit %s; current tip is %s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Stage exact release assets on both production origins
        if: steps.freshness.outputs.deploy == 'true' && inputs.stage_assets
        run: python3 scripts/portfolio_assets.py
      - name: Deploy exact digest and verify this origin
        if: steps.freshness.outputs.deploy == 'true'
        run: python3 scripts/coolify_deploy.py
      - name: Record successful target verification
        id: complete
        if: steps.freshness.outputs.deploy == 'true'
        run: echo 'deployed=true' >> "$GITHUB_OUTPUT"
