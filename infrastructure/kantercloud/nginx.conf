server {
    listen 10.40.30.32:443 ssl default_server;
    server_name portfolio-origin.kantercloud.internal shanekanterman.dev www.shanekanterman.dev;

    ssl_certificate /etc/nginx/tls/portfolio-origin.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/portfolio-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /srv/portfolio/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /__release {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        alias /srv/portfolio/state/release.json;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

server {
    listen 10.40.30.32:443 ssl;
    server_name portfolio-preview-origin.kantercloud.internal;

    ssl_certificate /etc/nginx/tls/portfolio-origin.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/portfolio-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    root /srv/portfolio-beta/current;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "ok\n";
    }

    location = /robots.txt {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    }
}
