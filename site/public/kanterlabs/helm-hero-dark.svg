<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
<title id="t">Helm</title><desc id="d">Animated illustration of a task moving across a Helm board while an agent reports progress.</desc>
<style>
.wheel{transform-origin:24px 24px;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mover{animation:move 9s cubic-bezier(.65,0,.35,1) infinite}
@keyframes move{0%{transform:translate(0px,0px);opacity:0}3%,14%{transform:translate(0px,0px);opacity:1}22%,39%{transform:translate(142px,0px)}47%,72%{transform:translate(284px,0px)}80%,96%{transform:translate(426px,0px);opacity:1}100%{transform:translate(426px,0px);opacity:0}}
.pulse,.done,.claim{opacity:0}
.pulse{animation:pulse 9s linear infinite}
@keyframes pulse{0%,46%{opacity:0}48%,72%{opacity:1}74%,100%{opacity:0}}
.ring{transform-origin:center;transform-box:fill-box;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.4);opacity:0}}
.done{animation:done 9s linear infinite}
@keyframes done{0%,79%{opacity:0}82%,96%{opacity:1}100%{opacity:0}}
.claim{animation:claim 9s linear infinite}
@keyframes claim{0%,40%{opacity:0}44%,72%{opacity:1}76%,100%{opacity:0}}
.bar{transform:scaleX(0);transform-origin:left;animation:bar 9s linear infinite;transform-box:fill-box}
@keyframes bar{0%,47%{transform:scaleX(0)}72%,100%{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.wheel,.mover,.pulse,.ring,.done,.claim,.bar{animation:none}}
</style>
