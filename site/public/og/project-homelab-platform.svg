  <text x="102" y="395" font-family="Inter,Arial,sans-serif" font-size="16" fill="#52525b">Reviewed configs and scripts</text>

  <rect x="465" y="255" width="290" height="100" rx="18" fill="#eef2ff" stroke="#6366f1" filter="url(#shadow)"/>
