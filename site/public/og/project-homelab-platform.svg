<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">KanterLabs Homelab Platform</title>
  <desc id="desc">Social preview showing a reviewed infrastructure repository connected to edge, workload, and ephemeral CI systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e2e8f0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <path d="M0 92H1200M0 184H1200M0 276H1200M0 368H1200M0 460H1200M0 552H1200M100 0V627M200 0V627M300 0V627M400 0V627M500 0V627M600 0V627M700 0V627M800 0V627M900 0V627M1000 0V627M1100 0V627" stroke="#0f172a" stroke-opacity=".035"/>
