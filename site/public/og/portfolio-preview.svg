<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title desc">
  <title id="title">Shane Kanterman — Linux platforms from bare metal to CI/CD</title>
  <desc id="desc">Dark editorial social preview for Shane Kanterman's infrastructure and platform portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#080b0a"/><stop offset="58%" stop-color="#0c100e"/><stop offset="100%" stop-color="#121914"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#96f7c2"/><stop offset="100%" stop-color="#4ade80"/></linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4ade80" stop-opacity=".18"/><stop offset="100%" stop-color="#4ade80" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <circle cx="1050" cy="92" r="310" fill="url(#glow)"/>
  <path d="M0 1H1200M0 626H1200" stroke="#26322c"/>
  <g transform="translate(72 64)">
    <rect width="1056" height="499" rx="22" fill="#101512" stroke="#2b3831" stroke-width="2"/>
    <rect x="1" y="1" width="6" height="497" rx="3" fill="url(#accent)"/>
    <g transform="translate(50 42)">
      <rect width="58" height="58" rx="16" fill="#17221c" stroke="#385245"/>
      <text x="29" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="800" fill="#b7f7d2">SK</text>
      <text x="82" y="24" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2.5" fill="#8ca397">SHANE KANTERMAN</text>
      <text x="82" y="49" font-family="Inter, Arial, sans-serif" font-size="17" fill="#d8e3dd">Infrastructure · Platform Engineering · Data Center Operations</text>
    </g>
    <text x="50" y="203" font-family="Inter, Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="-2.2" fill="#f4f7f5">I build Linux platforms,</text>
    <text x="50" y="277" font-family="Inter, Arial, sans-serif" font-size="61" font-weight="800" letter-spacing="-2.2" fill="url(#accent)">from bare metal to CI/CD.</text>
    <text x="50" y="336" font-family="Inter, Arial, sans-serif" font-size="23" fill="#aab9b1">Production hardware, hardened networking, ephemeral CI,</text>
    <text x="50" y="370" font-family="Inter, Arial, sans-serif" font-size="23" fill="#aab9b1">and repeatable delivery across a two-site Proxmox estate.</text>
    <g transform="translate(50 412)" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700">
      <rect width="126" height="42" rx="21" fill="#17221c" stroke="#30443a"/><text x="63" y="27" text-anchor="middle" fill="#dce8e1">PROXMOX</text>
      <rect x="140" width="104" height="42" rx="21" fill="#17221c" stroke="#30443a"/><text x="192" y="27" text-anchor="middle" fill="#dce8e1">LINUX</text>
      <rect x="258" width="206" height="42" rx="21" fill="#17221c" stroke="#30443a"/><text x="361" y="27" text-anchor="middle" fill="#dce8e1">GITHUB ACTIONS</text>
      <rect x="478" width="86" height="42" rx="21" fill="#17221c" stroke="#30443a"/><text x="521" y="27" text-anchor="middle" fill="#dce8e1">RUST</text>
    </g>
    <text x="1006" y="454" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#7f9489">SHANEKANTERMAN.DEV</text>
  </g>
</svg>
