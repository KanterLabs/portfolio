name: Validate Portfolio

on:
  workflow_dispatch:
  pull_request:
    branches: [beta, main]
  push:
    branches: [beta, main]

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.event.pull_request.number || gitea.ref }}
  cancel-in-progress: ${{ gitea.event_name == 'pull_request' }}

permissions:
  contents: read

# Each native job owns a disposable tool cache; no root-owned host cache.
env:
  RUNNER_TOOL_CACHE: /tmp/portfolio-toolcache

jobs:
  changes:
    if: gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository
    runs-on: homelab
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.paths.outputs.browser }}
      container: ${{ steps.paths.outputs.container }}
    steps:
      - uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify browser and container inputs
        id: paths
        env:
          BASE_SHA: ${{ gitea.event.pull_request.base.sha || gitea.event.before }}
          HEAD_SHA: ${{ gitea.event.pull_request.head.sha || gitea.sha }}
          EVENT_NAME: ${{ gitea.event_name }}
        run: |
          python3 - <<'PYCODE'
          import fnmatch, os, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          if not base or set(base) == {'0'}:
              paths = ['site/', 'Dockerfile']
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base + ('...' if os.environ['EVENT_NAME'] == 'pull_request' else '..') + head], text=True).splitlines()
          browser = any(fnmatch.fnmatch(p, pattern) for p in paths for pattern in
                        ['site/*', 'chat-worker/*', 'chat-content/*', 'divstack/*', '.gitmodules', 'scripts/*', '.github/workflows/*', '.gitea/workflows/*', 'package*'])
          container = os.environ['EVENT_NAME'] != 'pull_request' or browser or any(
              fnmatch.fnmatch(p, pattern) for p in paths for pattern in ['Dockerfile', '.dockerignore', 'container/*'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'browser={str(browser).lower()}\ncontainer={str(container).lower()}\n')
          PYCODE

  promotion-source:
    if: gitea.event_name == 'pull_request' && gitea.base_ref == 'main' && gitea.event.pull_request.head.repo.full_name == gitea.repository
    runs-on: homelab
    timeout-minutes: 5
    steps:
      - name: Require promotion from this repository's beta branch
        env:
          HEAD_REF: ${{ gitea.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ gitea.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ gitea.repository }}
        run: |
          set -euo pipefail
          [ "$HEAD_REF" = "beta" ]
          [ "$HEAD_REPOSITORY" = "$TARGET_REPOSITORY" ]

  dependency-audit:
    if: gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository
    runs-on: homelab
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workspace: [site, chat-worker]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json
      - name: Audit locked dependencies
        run: python3 ../scripts/npm_audit.py

  chat-worker-validate:
    if: gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository
    runs-on: homelab
    timeout-minutes: 10
    defaults:
      run:
        working-directory: chat-worker
    steps:
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: chat-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Audit knowledge freshness
        run: npm run knowledge:audit
      - name: Run Worker tests
        run: npm test
      - name: Build Worker deployment bundle
        run: npm run deploy:dry-run

  deployment-helper-test:
    if: gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository
    runs-on: homelab
    timeout-minutes: 5
    steps:
      - name: Record executed workflow source
        run: |
          printf 'workflow-source=%s\n' "${GITHUB_WORKFLOW_SHA:-$GITHUB_SHA}"
          printf 'Executed workflow source: `%s`\n' "${GITHUB_WORKFLOW_SHA:-$GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out repository
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test transactional Coolify deployment helper
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Prove canonical CI cannot read protected release configuration
        env:
          JOB_READ_TOKEN: ${{ secrets.GITEA_TOKEN }}
          RELEASE_DEPLOY_SECRET: ${{ secrets.PDX1_COOLIFY_API_TOKEN }}
        run: |
          python3 - <<'PYCODE'
          import os, urllib.request, urllib.error
          assert not os.environ.get('RELEASE_DEPLOY_SECRET'), 'Release credential reached canonical CI'
          assert not os.path.exists('/var/run/secrets/kubernetes.io/serviceaccount/token')
          url = 'https://gitea.home.shanekanterman.dev/api/v1/repos/KanterLabs/portfolio-release/actions/secrets'
          req = urllib.request.Request(url, headers={'Authorization': 'token ' + os.environ['JOB_READ_TOKEN']})
          try:
              urllib.request.urlopen(req, timeout=10).close()
          except urllib.error.HTTPError as error:
              assert error.code in (403, 404), error.code
              print('Protected release API denied:', error.code)
          else:
              raise SystemExit('Canonical CI unexpectedly accessed release secrets API')
          PYCODE

  browser-test:
    if: always() && (gitea.event_name != 'pull_request' || gitea.event.pull_request.head.repo.full_name == gitea.repository)
    needs: changes
    runs-on: homelab-heavy
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ gitea.workspace }}/.playwright-browsers
      PUBLIC_CHAT_ENABLED: "true"
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out repository
        if: needs.changes.outputs.browser == 'true'
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Node.js
        if: needs.changes.outputs.browser == 'true'
        uses: https://github.com/actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22.22.1"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        if: needs.changes.outputs.browser == 'true'
        run: npm ci
      - name: Cache matching Playwright Chromium downloads
        if: needs.changes.outputs.browser == 'true'
        uses: https://github.com/actions/cache@2cdf405574d6ef1f33a1d12acccd3ae82f47b3f2 # v4.1.0
        with:
          path: ${{ gitea.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('site/package-lock.json') }}
      - name: Install browser
        if: needs.changes.outputs.browser == 'true'
        run: npx playwright install chromium
      - name: Run browser tests
        if: needs.changes.outputs.browser == 'true'
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always() && needs.changes.outputs.browser == 'true' && job.status == 'failure'
        uses: https://github.com/actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report
          path: |
            site/playwright-report/
            site/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Report required browser validation result
        working-directory: ${{ gitea.workspace }}
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BROWSER_REQUIRED: ${{ needs.changes.outputs.browser }}
          VALIDATION_STATUS: ${{ job.status }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$BROWSER_REQUIRED" = true || test "$BROWSER_REQUIRED" = false
          test "$VALIDATION_STATUS" = success

  container:
    needs: [changes, dependency-audit, chat-worker-validate, deployment-helper-test, browser-test]
    runs-on: homelab-heavy
    concurrency:
      group: portfolio-container-${{ gitea.ref }}
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out repository
        if: needs.changes.outputs.container == 'true'
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build immutable image
        if: needs.changes.outputs.container == 'true'
        env:
          REPOSITORY_OWNER: ${{ gitea.repository_owner }}
        run: |
          set -euo pipefail
          image_owner=$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/${image_owner}/portfolio"
          docker build \
            --pull \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +%Y-%m-%d)" \
            --tag "$image:sha-$GITHUB_SHA" \
            .
          printf 'IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
      - name: Smoke-test image
        if: needs.changes.outputs.container == 'true'
        run: |
          set -euo pipefail
          container_id=''
          html_file=$(mktemp)
          # shellcheck disable=SC2317
          cleanup() {
            local status=$?
            if [ -n "$container_id" ]; then
              if [ "$status" -ne 0 ]; then
                docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{json .State.Error}} ports={{json .NetworkSettings.Ports}}' "$container_id" || true
                docker logs --tail 40 "$container_id" || true
              fi
              docker rm --force "$container_id" >/dev/null 2>&1 || true
            fi
            rm -f "$html_file"
          }
          trap cleanup EXIT
          container_id=$(docker run --detach \
            -e PORTFOLIO_X_ROBOTS_TAG='noindex, nofollow, noarchive' \
            -p 127.0.0.1::8080 \
            "$IMAGE:sha-$GITHUB_SHA")
          startup_deadline=$((SECONDS + 10))
          smoke_get() {
            local remaining=$((startup_deadline - SECONDS))
            [ "$remaining" -gt 0 ] && curl --fail --silent --max-time "$remaining" "$@"
          }
          while [ "$SECONDS" -lt "$startup_deadline" ]; do
            port_binding=$(timeout 1 docker port "$container_id" 8080/tcp 2>/dev/null || true)
            # The footer build stamp is injected at image-build time, so a
            # broken injection can only be caught against the built image --
            # never against a dev build, which can still fall back to git.
            if [[ "$port_binding" =~ ^127\.0\.0\.1:([0-9]{1,5})$ ]]; then
              container_port=${BASH_REMATCH[1]}
              if ((10#$container_port > 0 && 10#$container_port <= 65535)) &&
                 smoke_get "http://127.0.0.1:${container_port}/healthz" | grep -qx ok &&
                 smoke_get "http://127.0.0.1:${container_port}/_meta/revision" | grep -qx "$GITHUB_SHA" &&
                 smoke_get "http://127.0.0.1:${container_port}/" --output "$html_file" &&
                 grep -q "site-footer-build\">Build .*${GITHUB_SHA:0:7}" "$html_file"; then
                exit 0
              fi
            fi
            sleep 1
          done
          exit 1
